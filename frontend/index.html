<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EnviRisk AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            color: #1f2937;
        }

        header {
            background: #14532d;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin-top: 8px;
            opacity: 0.9;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #14532d;
        }

        .upload-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            background: #166534;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            background: #14532d;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(200px, 1fr)
            );
            gap: 12px;
            margin-top: 15px;
        }

        .upload-status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .upload-status.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .upload-status.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .answer {
            white-space: pre-wrap;
            line-height: 1.6;
            background: #f9fafb;
            padding: 18px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .sources {
            margin-top: 20px;
        }

        .source {
            background: #f0fdf4;
            border-left: 4px solid #166534;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 5px;
        }

        .passages {
            margin-top: 20px;
        }

        .passage {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
        }

        .passage-header {
            font-weight: bold;
            color: #14532d;
            margin-bottom: 8px;
        }

        .passage-text {
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .hidden {
            display: none;
        }

        .label {
            font-weight: bold;
            margin-bottom: 6px;
            display: block;
        }

        .document-info {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
        }

    </style>
</head>


<body>

<header>

    <h1>🌱 EnviRisk AI</h1>

    <p>
        Système intelligent d'analyse environnementale
        avec RAG et Qwen3
    </p>

</header>


<div class="container">


    <!-- ========================= -->
    <!-- IMPORT DOCUMENT -->
    <!-- ========================= -->

    <div class="card">

        <h2>📄 Importer un document</h2>

        <div class="upload-area">

            <label class="label">
                Type de document
            </label>

            <select id="documentType">

                <option value="">
                    -- Sélectionner le type --
                </option>

                <option value="EIES">
                    EIES
                </option>

                <option value="PGES">
                    PGES
                </option>

                <option value="AUTRE">
                    AUTRE
                </option>

            </select>


            <label class="label">
                Fichier PDF
            </label>

            <input
                type="file"
                id="fileInput"
                accept=".pdf"
            >


            <button
                id="uploadButton"
                type="button"
            >
                📥 Importer le document
            </button>


            <div
                id="uploadStatus"
                class="upload-status"
            ></div>


            <div
                id="documentInfo"
                class="document-info hidden"
            ></div>

        </div>

    </div>



    <!-- ========================= -->
    <!-- ANALYSE -->
    <!-- ========================= -->

    <div class="card">

        <h2>🔍 Analyse environnementale</h2>


        <label class="label">
            Votre question
        </label>


        <textarea
            id="question"
            placeholder="Exemple : Quels sont les principaux impacts environnementaux du projet ?"
        ></textarea>


        <div class="buttons">

            <button
                type="button"
                id="askButton"
            >
                💬 Poser une question
            </button>


            <button
                type="button"
                id="risksButton"
            >
                🔍 Identifier les risques
            </button>


            <button
                type="button"
                id="impactsButton"
            >
                🌱 Identifier les impacts
            </button>


            <button
                type="button"
                id="evaluationButton"
            >
                📊 Évaluer l'importance des impacts
            </button>

        </div>

    </div>



    <!-- ========================= -->
    <!-- RESULTAT -->
    <!-- ========================= -->

    <div
        class="card"
        id="resultCard"
    >

        <h2>🤖 Résultat de l'analyse</h2>


        <div
            id="answer"
            class="answer"
        >
            Les résultats apparaîtront ici.
        </div>


        <div
            id="sources"
            class="sources"
        ></div>


        <div
            id="passages"
            class="passages"
        ></div>

    </div>


</div>



<script>

    // ==========================================================
    // CONFIGURATION
    // ==========================================================

    const API_URL =
        "http://127.0.0.1:8000";


    // ==========================================================
    // ELEMENTS HTML
    // ==========================================================

    const fileInput =
        document.getElementById("fileInput");

    const documentType =
        document.getElementById("documentType");

    const uploadButton =
        document.getElementById("uploadButton");

    const uploadStatus =
        document.getElementById("uploadStatus");

    const documentInfo =
        document.getElementById("documentInfo");

    const question =
        document.getElementById("question");

    const askButton =
        document.getElementById("askButton");

    const risksButton =
        document.getElementById("risksButton");

    const impactsButton =
        document.getElementById("impactsButton");

    const evaluationButton =
        document.getElementById("evaluationButton");

    const answer =
        document.getElementById("answer");

    const sources =
        document.getElementById("sources");

    const passages =
        document.getElementById("passages");



    // ==========================================================
    // FONCTION UPLOAD
    // ==========================================================

    uploadButton.addEventListener(
        "click",
        async function () {

            const file =
                fileInput.files[0];

            const type =
                documentType.value;


            // Vérification fichier

            if (!file) {

                uploadStatus.className =
                    "upload-status error";

                uploadStatus.textContent =
                    "❌ Veuillez sélectionner un fichier PDF.";

                return;
            }


            // Vérification type

            if (!type) {

                uploadStatus.className =
                    "upload-status error";

                uploadStatus.textContent =
                    "❌ Veuillez sélectionner le type du document.";

                return;
            }


            // Vérification extension

            if (
                !file.name
                    .toLowerCase()
                    .endsWith(".pdf")
            ) {

                uploadStatus.className =
                    "upload-status error";

                uploadStatus.textContent =
                    "❌ Le fichier doit être au format PDF.";

                return;
            }


            const formData =
                new FormData();


            formData.append(
                "file",
                file
            );


            formData.append(
                "document_type",
                type
            );


            uploadButton.disabled =
                true;


            uploadStatus.className =
                "upload-status";


            uploadStatus.textContent =
                "⏳ Importation et indexation du document...";


            try {

                // =========================
                // APPEL API UPLOAD
                // =========================

                const response =
                    await fetch(
                        `${API_URL}/upload`,
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json();


                console.log(
                    "Réponse upload :",
                    data
                );


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        data.message ||
                        "Erreur pendant l'importation."
                    );

                }


                // =========================
                // MESSAGE SUCCES
                // =========================

                uploadStatus.className =
                    "upload-status success";


                uploadStatus.textContent =
                    `✅ ${data.message} ` +
                    `Type : ${data.document_type} | ` +
                    `${data.pages || 0} pages, ` +
                    `${data.chunks || 0} passages indexés`;


                // =========================
                // INFORMATIONS DOCUMENT
                // =========================

                documentInfo.classList.remove(
                    "hidden"
                );


                documentInfo.textContent =
                    `📘 Document actuel : ` +
                    `${data.filename} | ` +
                    `Type : ${data.document_type}`;


                // On conserve le type sélectionné
                // pour les prochaines analyses

            }

            catch (err) {

                console.error(
                    "Erreur upload :",
                    err
                );


                uploadStatus.className =
                    "upload-status error";


                uploadStatus.textContent =
                    "❌ Erreur : " +
                    err.message;

            }

            finally {

                uploadButton.disabled =
                    false;

            }

        }
    );



    // ==========================================================
    // FONCTION ANALYSE
    // ==========================================================

    async function analyze(
        mode
    ) {

        const questionText =
            question.value.trim();


        // Si aucune question

        if (!questionText) {

            answer.textContent =
                "⚠️ Veuillez saisir une question.";

            return;
        }


        // Nettoyage précédent

        answer.textContent =
            "⏳ Analyse en cours avec Qwen3...";


        sources.innerHTML =
            "";

        passages.innerHTML =
            "";


        // Désactiver les boutons

        askButton.disabled =
            true;

        risksButton.disabled =
            true;

        impactsButton.disabled =
            true;

        evaluationButton.disabled =
            true;


        try {

            // =========================
            // APPEL API ASK
            // =========================

            const response =
                await fetch(
                    `${API_URL}/ask`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            question:
                                questionText,

                            top_k:
                                5,

                            mode:
                                mode

                        })
                    }
                );


            const data =
                await response.json();


            console.log(
                "Réponse analyse :",
                data
            );


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    data.message ||
                    "Erreur pendant l'analyse."
                );

            }


            // =========================
            // REPONSE QWEN
            // =========================

            answer.textContent =
                data.answer ||
                "Aucune réponse générée.";


            // =========================
            // TYPE(S) DE DOCUMENT
            // =========================

            if (
                data.document_types &&
                data.document_types.length > 0
            ) {

                const typeInfo =
                    document.createElement(
                        "div"
                    );


                typeInfo.className =
                    "document-info";


                typeInfo.textContent =
                    "📘 Type(s) de document analysé(s) : " +
                    data.document_types.join(
                        ", "
                    );


                answer.parentNode.insertBefore(
                    typeInfo,
                    answer
                );

            }


            // =========================
            // SOURCES
            // =========================

            if (
                data.sources &&
                data.sources.length > 0
            ) {

                const title =
                    document.createElement(
                        "h3"
                    );

                title.textContent =
                    "📚 Sources utilisées";


                sources.appendChild(
                    title
                );


                data.sources.forEach(
                    (source, index) => {

                        const sourceElement =
                            document.createElement(
                                "div"
                            );


                        sourceElement.className =
                            "source";


                        const documentType =
                            source.document_type ||
                            "AUTRE";


                        sourceElement.textContent =
                            `${index + 1}. ` +
                            `Document : ${source.document} | ` +
                            `Type : ${documentType} | ` +
                            `Page : ${source.page} | ` +
                            `Pertinence : ${source.similarity_percent} %`;


                        sources.appendChild(
                            sourceElement
                        );

                    }
                );

            }



            // =========================
            // PASSAGES
            // =========================

            if (
                data.passages &&
                data.passages.length > 0
            ) {

                const title =
                    document.createElement(
                        "h3"
                    );

                title.textContent =
                    "📄 Passages récupérés";


                passages.appendChild(
                    title
                );


                data.passages.forEach(
                    (passage, index) => {

                        const passageElement =
                            document.createElement(
                                "div"
                            );


                        passageElement.className =
                            "passage";


                        const header =
                            document.createElement(
                                "div"
                            );


                        header.className =
                            "passage-header";


                        header.textContent =
                            `${index + 1}. ` +
                            `${passage.document} | ` +
                            `Type : ${
                                passage.document_type ||
                                "AUTRE"
                            } | ` +
                            `Page : ${passage.page} | ` +
                            `Pertinence : ${passage.similarity_percent} %`;


                        const text =
                            document.createElement(
                                "div"
                            );


                        text.className =
                            "passage-text";


                        text.textContent =
                            passage.text;


                        passageElement.appendChild(
                            header
                        );


                        passageElement.appendChild(
                            text
                        );


                        passages.appendChild(
                            passageElement
                        );

                    }
                );

            }

        }

        catch (err) {

            console.error(
                "Erreur analyse :",
                err
            );


            answer.textContent =
                "❌ Impossible de contacter l'API : " +
                err.message;

        }

        finally {

            askButton.disabled =
                false;

            risksButton.disabled =
                false;

            impactsButton.disabled =
                false;

            evaluationButton.disabled =
                false;

        }

    }



    // ==========================================================
    // BOUTONS
    // ==========================================================

    askButton.addEventListener(
        "click",
        function () {

            analyze(
                "question"
            );

        }
    );


    risksButton.addEventListener(
        "click",
        function () {

            analyze(
                "risks"
            );

        }
    );


    impactsButton.addEventListener(
        "click",
        function () {

            analyze(
                "impacts"
            );

        }
    );


    evaluationButton.addEventListener(
        "click",
        function () {

            analyze(
                "evaluation"
            );

        }
    );


</script>


</body>

</html>
