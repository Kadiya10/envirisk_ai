</div>

<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(
            ".toggle-password"
        );

    if (password.type === "password") {

        password.type = "text";

        button.textContent = "🙈";

    } else {

        password.type = "password";

        button.textContent = "👁️";
    }
}


function showMessage(
    message,
    type
) {

    const messageBox =
        document.getElementById("message");

    messageBox.textContent = message;

    messageBox.className =
        "message " + type;
}


document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const button =
                document
                    .getElementById("loginButton");


            button.disabled = true;

            button.textContent =
                "Connexion...";


            try {

                const response =
                    await fetch(
                        "/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "Erreur de connexion."
                    );
                }


                /*
                 * Nous conservons temporairement
                 * les informations de l'utilisateur
                 * dans le navigateur.
                 */

                localStorage.setItem(
                    "envirisk_user",
                    JSON.stringify({
                        id: data.user_id,
                        name: data.name,
                        email: data.email
                    })
                );


                showMessage(
                    "Connexion réussie. Redirection...",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "/app";

                    },
                    800
                );


            } catch (error) {

                showMessage(
                    error.message,
                    "error"
                );

                button.disabled = false;

                button.textContent =
                    "Se connecter";
            }

        }
    );

</script>
