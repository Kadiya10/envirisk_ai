<div class="card">

    <div class="logo">🌱</div>

    <h1>Créer un compte</h1>

    <p class="subtitle">
        Rejoignez EnviRisk AI
    </p>

    <div id="message" class="message"></div>

    <form id="registerForm">

        <div class="form-group">
            <label for="name">
                Nom complet
            </label>

            <input
                type="text"
                id="name"
                placeholder="Votre nom complet"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">
                Adresse e-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="exemple@email.com"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">
                Mot de passe
            </label>

            <div class="password-container">

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 8 caractères"
                    minlength="8"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('password', this)"
                >
                    👁️
                </button>

            </div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">
                Confirmer le mot de passe
            </label>

            <div class="password-container">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Répétez votre mot de passe"
                    minlength="8"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('confirmPassword', this)"
                >
                    👁️
                </button>

            </div>
        </div>

        <div class="terms">

            <input
                type="checkbox"
                id="terms"

        <button

</div>

</div>

<script>

function togglePassword(
    fieldId,
    button
) {

    const field =
        document.getElementById(fieldId);

    if (field.type === "password") {

        field.type = "text";

        button.textContent = "🙈";

    } else {

        field.type = "password";

        button.textContent = "👁️";
    }
}


function showMessage(
    message,
    type
) {

    const messageBox =
        document.getElementById("message");

    messageBox.textContent = message;

    messageBox.className =
        "message " + type;
}


document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;

            const terms =
                document
                    .getElementById("terms")
                    .checked;

            const button =
                document
                    .getElementById("registerButton");


            if (!name) {

                showMessage(
                    "Veuillez saisir votre nom.",
                    "error"
                );

                return;
            }


            if (password.length < 8) {

                showMessage(
                    "Le mot de passe doit contenir au moins 8 caractères.",
                    "error"
                );

                return;
            }


            if (password !== confirmPassword) {

                showMessage(
                    "Les mots de passe ne correspondent pas.",
                    "error"
                );

                return;
            }


            if (!terms) {

                showMessage(
                    "Veuillez accepter les conditions d'utilisation.",
                    "error"
                );

                return;
            }


            button.disabled = true;

            button.textContent =
                "Création du compte...";


            try {

                const response =
                    await fetch(
                        "/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                name: name,
                                email: email,
                                password: password
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "Une erreur est survenue."
                    );
                }


                showMessage(
                    "Compte créé avec succès ! Redirection vers la connexion...",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "/login.html";

                    },
                    1500
                );


            } catch (error) {

                showMessage(
                    error.message,
                    "error"
                );

                button.disabled = false;

                button.textContent =
                    "Créer mon compte";
            }

        }
    );

</script>
